server {
    listen 8080 default_server;
    listen 80;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Security & standard headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Keep discovery assets revalidatable so search engines and browsers do not
    # remain pinned to an outdated favicon after a deployment.
    location ~* ^/(?:favicon(?:-[0-9]+x[0-9]+)?\.(?:ico|png|svg)|apple-touch-icon\.png)$ {
        expires off;
        access_log off;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires off;
        access_log off;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|eot|ttf|otf|webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Health check endpoint for HostForge
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
